name: mpv probe

# Loads the mpv AAR on the same emulator setup as emulator-test.yml and tries each vo/hwdec
# combination. Runs only when the probe itself changes, or by hand.
on:
  push:
    branches: ['claude/**']
    paths:
      - '.github/emulator/mpv-probe/**'
      - '.github/workflows/mpv-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build probe
        working-directory: .github/emulator/mpv-probe
        run: gradle assembleDebug --console=plain

      - name: Make sample media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p media
          ffmpeg -nostdin -loglevel error -f lavfi -i testsrc2=s=1280x720:r=30:d=20 -f lavfi -i sine=f=440:d=20 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac media/h264.mp4
          ffmpeg -nostdin -loglevel error -f lavfi -i testsrc2=s=1280x720:r=30:d=20 -f lavfi -i sine=f=440:d=20 \
            -c:v libx265 -pix_fmt yuv420p10le -c:a aac media/hevc10.mkv

      - name: Free memory
        run: |
          gradle --stop || true
          pkill -f KotlinCompileDaemon || true
          pkill -f GradleDaemon || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator (Android 14, x86_64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash .github/emulator/mpv-probe/run.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mpv-probe
          path: out
