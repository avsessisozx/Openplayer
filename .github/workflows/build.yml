name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Sürüm etiketi (örn. v1.0.0-beta2). Boş bırakırsan sadece derler.'
        required: false
        default: ''

# Varsayılan: salt okunur. Yazma yetkisi yalnızca release işinde verilir.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      # Dağıtılan APK, hata ayıklanabilir (debuggable) olmayan release derlemesidir.
      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk OpenPlayer.apk

      - name: Checksum
        run: sha256sum OpenPlayer.apk > OpenPlayer.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-apk
          path: |
            OpenPlayer.apk
            OpenPlayer.apk.sha256

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenPlayer-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          flag=""
          case "$TAG" in *-*) flag="--prerelease";; esac
          gh release create "$TAG" OpenPlayer.apk OpenPlayer.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenPlayer $TAG" --notes-file RELEASE_NOTES.md $flag
