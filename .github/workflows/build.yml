name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Sürüm etiketi (örn. v1.0.0-beta2). Boş bırakırsan sadece derler.'
        required: false
        default: ''

# Varsayılan: salt okunur. Yazma yetkisi yalnızca release işinde verilir.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 8.14.3

      # Dağıtılan APK, hata ayıklanabilir (debuggable) olmayan release derlemesidir.
      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --stacktrace 2>&1 | tee build.log || {
            grep -E '^e: ' build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk OpenPlayer.apk

      - name: Checksum
        run: sha256sum OpenPlayer.apk > OpenPlayer.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: OpenPlayer-apk
          path: |
            OpenPlayer.apk
            OpenPlayer.apk.sha256

  release:
    needs: build
    # Etiketle, elle ya da ana dala gönderimde (sürüm numarası yeni ise) yayınlanır.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: OpenPlayer-apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            TAG="v$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)"
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$TAG zaten yayınlanmış; atlanıyor."
              exit 0
            fi
          fi
          flag=""
          case "$TAG" in *-*) flag="--prerelease";; esac
          gh release create "$TAG" OpenPlayer.apk OpenPlayer.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "OpenPlayer $TAG" --notes-file RELEASE_NOTES.md $flag
